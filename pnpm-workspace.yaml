packages:
  - .
  - fixtures/consumer
  - preview/web

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: set this to true or false
  workerd: set this to true or false

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@lix-js/sdk-darwin-arm64"
  - "@lix-js/sdk-linux-arm64"
  - "@lix-js/sdk-linux-x64"
  - "@lix-js/sdk-win32-x64"
  - "@lix-js/sdk"
  - "@opral/zettel-ast"
  - "@opral/zettel-html"
  - "@opral/zettel-lexical"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

overrides:
  prosemirror-model: 1.25.10
  prosemirror-transform: 1.12.0
  prosemirror-view: 1.42.0
patchedDependencies:
  '@glideapps/glide-data-grid@6.0.3': patches/@glideapps__glide-data-grid@6.0.3.patch
  '@opral/zettel-html@1.1.0': patches/@opral__zettel-html@1.1.0.patch
  '@opral/zettel-lexical@1.1.0': patches/@opral__zettel-lexical@1.1.0.patch
  "@pierre/trees": patches/@pierre__trees.patch

peerDependencyRules:
  allowedVersions:
    "@glideapps/glide-data-grid>react": ^19.0.0
    "@glideapps/glide-data-grid>react-dom": ^19.0.0
    # Lix main carries the next SDK APIs before its package version is released.
    "@opral/atelier>@lix-js/sdk": 0.12.3
